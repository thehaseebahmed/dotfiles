services:
    insta-parser:
        container_name: insta-parser
        image: ghcr.io/thehaseebahmed/insta-parser:v0.1.0
        restart: always
        ports:
            - 8420:8000
        volumes:
            - ~/volumes/insta-parser/data:/data
        environment:
            TZ: "Europe/Amsterdam"
            WORK_DIR: "/data"
            WHISPER_MODEL: "base"
            KEEP_FILES: "false"
            JOB_TTL_HOURS: "24"
            # Optional authenticated Instagram session (see README).
            # IG_USERNAME: "your_ig_username"
            # IG_SESSION_FILE: "/data/session-your_ig_username"
            # Optional place-metadata enrichment (see README). Both independent of
            # each other; leave either unset to skip that piece.
            # LITELLM_BASE_URL: "http://172.17.0.1:4000"
            # LITELLM_API_KEY: "sk-..."
            # LITELLM_MODEL: "your-model-alias"
            # GOOGLE_MAPS_API_KEY: "..."
            # Tuning knobs, defaults shown:
            # TRANSCRIBE_CONCURRENCY: "1"
            # FFMPEG_TIMEOUT: "300"
            # MAX_FRAMES: "60"
            # FRAME_SCALE_HEIGHT: "720"
            # SCENE_THRESHOLD: "0.3"
            # OCR_DEDUPE_THRESHOLD: "90"
            # LOG_LEVEL: "INFO"
