services:
  bentopdf:
    image: ghcr.io/alam00000/bentopdf-simple:v2.8.7
    container_name: bentopdf
    ports:
      - '3004:8080'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8080']
      interval: 30s
      timeout: 10s
      retries: 3
