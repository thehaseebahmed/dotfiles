- name: Services
  width: slim
  hide-desktop-navigation: false
  center-vertically: true
  columns:
    - size: full
      widgets:
        - type: monitor
          cache: 15m
          title: Failing
          hide-header: true
          show-failing-only: true
          sites:
            - $include: services/a.yml
            - $include: services/b.yml
            - $include: services/h.yml
            - $include: services/i.yml
            - $include: services/j.yml
            - $include: services/n.yml
            - $include: services/o.yml
            - $include: services/p.yml
            - $include: services/q.yml
            - $include: services/r.yml
            - $include: services/s.yml
            - $include: services/w.yml
            - $include: services/z.yml

        - type: bookmarks
          groups:
            - title: Reading
              links:
                - title: Hardcover
                  url: https://hardcover.app/home
                - title: Currently Reading
                  url: https://hardcover.app/@thehaseebahmed/books/currently-reading
                - title: Want to Read
                  url: https://hardcover.app/@thehaseebahmed/books/want-to-read
            - title: Networking
              links:
                - title: Machines
                  url: https://console.tailscale.com/admin/machines
                - title: Services
                  url: https://console.tailscale.com/admin/services

        - type: monitor
          cache: 15m
          title: A
          sites:
            $include: services/a.yml

        - type: monitor
          cache: 15m
          title: B
          sites:
            $include: services/b.yml

        - type: monitor
          cache: 15m
          title: H
