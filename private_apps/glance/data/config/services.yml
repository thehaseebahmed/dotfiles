- name: Services
  width: slim
  hide-desktop-navigation: false
  center-vertically: true
  columns:
    - size: full
      widgets:
        - type: monitor
          cache: 15m
          title: Failing
          hide-header: true
          show-failing-only: true
          sites:
            - $include: services/a.yml
            - $include: services/b.yml
            - $include: services/h.yml
            - $include: services/i.yml
            - $include: services/j.yml
            - $include: services/n.yml
            - $include: services/p.yml
            - $include: services/q.yml
            - $include: services/r.yml
            - $include: services/s.yml
            - $include: services/w.yml
            - $include: services/z.yml

        - type: monitor
          cache: 15m
